# VAE-GMM on OASIS
# Exact hyperparameters from paper experiments

experiment:
  name: "oasis_vae_gmm"
  seed: 42
  results_dir: "./results"

model:
  name: "vae_gmm"
  latent_dim: 32
  num_clusters: 8

dataset:
  name: "oasis"
  root: "./data"
  batch_size: 32
  num_workers: 0
  shuffle: true

training:
  epochs: 150
  learning_rate: 0.0001
  device: "cuda"
  eval_gmm_covariance: "diag"

staged_training:
  enabled: true
  stage1_end_epoch: 50
  stage2_end_epoch: 100
  stage1_weights:
    reconstruction: 1.0
    kl: 0.01
    gmm: 0.0
  stage2_weights:
    reconstruction: 1.0
    kl: 0.1
    gmm: 0.5

logging:
  use_tqdm: true
  log_interval: 5
  save_metrics: true
  visualization_interval: 10

loss_weights:
  reconstruction: 1.0
  kl: 0.1
  gmm: 0.5

# Baseline K-Means on OASIS
# Pixel-space K-Means clustering (non-neural baseline)

experiment:
  name: "oasis_baseline_kmeans"
  seed: 42
  results_dir: "./results"

model:
  name: "baseline_kmeans"
  latent_dim: 16384
  num_clusters: 8

dataset:
  name: "oasis"
  root: "./data"
  batch_size: 64
  num_workers: 0
  shuffle: false

training:
  epochs: 1
  learning_rate: 0.001
  device: "cpu"

logging:
  use_tqdm: true
  log_interval: 1
  save_metrics: true
  visualization_interval: 1

loss_weights:
  reconstruction: 0.0
  kl: 0.0
  gmm: 0.0

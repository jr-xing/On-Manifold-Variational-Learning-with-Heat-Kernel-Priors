# Diffusion-VAE on OASIS
# Exact hyperparameters from paper experiments
# Trains a latent-space denoiser on top of a frozen VAE-GMM

experiment:
  name: "oasis_diffusion_vae"
  seed: 42
  results_dir: "./results"

model:
  name: "diffusion_vae"
  latent_dim: 32
  num_clusters: 8

dataset:
  name: "oasis"
  root: "./data"
  batch_size: 64
  num_workers: 0
  shuffle: true

training:
  epochs: 50
  learning_rate: 0.001
  device: "cuda"
  eval_gmm_covariance: "diag"

loss_weights:
  reconstruction: 1.0
  kl: 0.1
  gmm: 1.0

logging:
  use_tqdm: true
  log_interval: 5
  save_metrics: true
  visualization_interval: 10

diffusion:
  hidden_dim: 128
  num_layers: 3
  time_embed_dim: 32
  timesteps: 100
  schedule: "linear"
  max_timestep: 15
  n_mc: 50
  iters: 10000
  learning_rate: 0.001
  batch_size: 128
  eval_timesteps: [1, 2, 3, 5, 7, 10, 14]

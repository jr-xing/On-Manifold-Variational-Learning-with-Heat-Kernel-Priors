# VAE-GMM on Cardiac
# Exact hyperparameters from paper experiments

experiment:
  name: "cardiac_vae_gmm"
  seed: 42
  results_dir: "./results"

model:
  name: "vae_gmm"
  latent_dim: 10
  num_clusters: 5

dataset:
  name: "cardiac"
  root: "./data"
  batch_size: 64
  num_workers: 2
  shuffle: true

training:
  epochs: 100
  learning_rate: 0.001
  device: "cuda"
  eval_gmm_covariance: "diag"

logging:
  use_tqdm: true
  log_interval: 10
  save_metrics: true
  visualization_interval: 10

loss_weights:
  reconstruction: 1.0
  kl: 0.1
  gmm: 2.0

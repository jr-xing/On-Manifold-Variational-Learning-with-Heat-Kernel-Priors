# Baseline GMM on MNIST
# Pixel-space GMM clustering (non-neural baseline)
# Exact hyperparameters from paper experiments

experiment:
  name: "mnist_baseline_gmm"
  seed: 42
  results_dir: "./results"

model:
  name: "baseline_gmm"
  latent_dim: 784
  num_clusters: 10

dataset:
  name: "mnist"
  root: "./data"
  batch_size: 1024
  num_workers: 0
  shuffle: false

training:
  epochs: 1
  learning_rate: 0.001
  device: "cpu"

logging:
  use_tqdm: true
  log_interval: 10
  save_metrics: true
  visualization_interval: 1

loss_weights:
  reconstruction: 0.0
  kl: 0.0
  gmm: 0.0
